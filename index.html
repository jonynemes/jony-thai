<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>התאילנדי של ג'וני</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6e9;--ink:#1d2b24;--green:#1f5d46;--chili:#d6322b;--lime:#c9d94a;--card:#fff;--line:#e4dcc4}
@media (prefers-color-scheme:dark){:root{--bg:#14201b;--ink:#f3eedd;--green:#7fd1a6;--chili:#ff6a5f;--lime:#c9d94a;--card:#1d2d26;--line:#2f443a}}
*{box-sizing:border-box}
body{margin:0;font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2,h3{font-family:'Secular One','Heebo',sans-serif;font-weight:400;margin:0}
header{padding:2.2rem 1.2rem 1.4rem;text-align:center;border-bottom:3px solid var(--chili)}
header h1{font-size:clamp(2.4rem,9vw,4.5rem);color:var(--chili);line-height:1}
header p{margin:.6rem 0 0;color:var(--green);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:1rem 1rem 6rem}
.view{display:none}.view.on{display:block}
.cat{margin:1.8rem 0 .6rem;color:var(--green);font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:.8rem}
.dish{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.9rem}
.dish .top{display:flex;justify-content:space-between;gap:.5rem;font-weight:800}
.dish .price{color:var(--chili);white-space:nowrap}
.dish small{display:block;opacity:.75;margin:.2rem 0 .6rem}
.qty{display:flex;align-items:center;gap:.6rem}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:.6rem 1rem;font-weight:600}
.qb{width:2.4rem;height:2.4rem;padding:0;background:var(--lime);color:#1d2b24;font-size:1.3rem}
.qn{min-width:1.6rem;text-align:center;font-weight:800}
.note{width:100%;margin-top:.6rem;display:none}
.dish.has .note{display:block}
input,textarea{font:inherit;width:100%;padding:.6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--chili);outline-offset:2px}
.bar{position:fixed;inset:auto 0 0 0;background:var(--green);color:#fff;padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:center;gap:1rem}
.bar.on{display:flex}
.primary{background:var(--chili);color:#fff}
.ghost{background:transparent;border:1px solid currentColor;color:inherit}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin:1rem 0}
.row{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
label{display:block;font-weight:600;margin:.7rem 0 .25rem}
.total{font-size:1.6rem;color:var(--chili);font-family:'Secular One',sans-serif}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem}
.pay a,.pay button{display:block;text-align:center;text-decoration:none;color:#fff;padding:.8rem;border-radius:8px;font-weight:800}
.bit{background:#1b6ef3}.pbx{background:#00a0c6}
.copyrow{display:flex;gap:.5rem;margin-top:.5rem}
.copyrow button{flex:1;background:var(--lime);color:#1d2b24}
#toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:1rem;z-index:10}
.modal.on{display:flex}
.modal .card{background:var(--card);color:var(--ink);border-radius:14px;padding:1.6rem;max-width:380px;width:100%;text-align:center}
.modal .card h3{font-size:1.6rem;color:var(--green);margin-bottom:.5rem}
.spin{width:2.6rem;height:2.6rem;border:4px solid var(--line);border-top-color:var(--chili);border-radius:50%;margin:.4rem auto 1rem;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}
</style>
</head>
<body>
<header><h1>התאילנדי של ג'וני</h1><p>מנות תאילנדיות חמות, מוכנות לאיסוף</p></header>
<main>
  <section id="v-menu" class="view on"><div id="menu"></div></section>

  <section id="v-order" class="view">
    <h2>פרטי ההזמנה</h2>
    <div class="box" id="orderList"></div>
    <div class="box">
      <label for="name">שם מלא</label><input id="name" autocomplete="name">
      <label for="phone">טלפון</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel">
      <label for="gnote">הערה כללית להזמנה (לא חובה)</label><textarea id="gnote" rows="2"></textarea>
    </div>
    <p class="total" id="oTotal"></p>
    <button class="ghost" data-go="menu">חזרה לתפריט</button>
    <button class="primary" id="toCheckout">לסיום הזמנה</button>
  </section>

  <section id="v-checkout" class="view">
    <h2>סיכום הזמנה <span id="orderNo"></span></h2>
    <div class="box" id="summary"></div>
    <p>סכום לתשלום: <span class="total" id="cTotal"></span></p>
    <div class="box">
      <h3>תשלום</h3>
      <div class="pay">
        <a class="bit" id="bitLink" href="#">פתיחת ביט</a>
        <a class="pbx" id="pbxLink" href="#">פתיחת PayBox</a>
      </div>
      <div class="copyrow">
        <button id="cpPhone">העתקת מספר לתשלום</button>
        <button id="cpAmount">העתקת סכום</button>
      </div>
      <p><small>המספר לתשלום: <b id="payPhoneTxt"></b>. בשדה ההערה בהעברה כתבו את מספר ההזמנה.</small></p>
      <button class="primary" id="paid" style="width:100%">שילמתי – דווח תשלום</button>
      <p id="status" aria-live="polite"></p>
    </div>
    <button class="ghost" id="newOrder">הזמנה חדשה</button>
  </section>
</main>

<div class="bar" id="bar"><span id="barTxt"></span><button class="primary" data-go="order">להזמנה</button></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-live="polite"><div class="card" id="modalCard"></div></div>
<div id="toast"></div>

<script>
/* ===== הגדרות – לערוך כאן ===== */
const CONFIG = {
  PAY_PHONE: "054-4742232",              // מספר הטלפון לקבלת תשלום (ביט / פייבוקס)
  SHEETS_URL: "https://script.google.com/macros/s/AKfycbxHnb1rh7o6rO2AN9aVRK-nHPhqIECX-4FyEIpjVhUoq5H4F_dAc0Q4EjD1OW-AM-rclQ/exec",                        // כתובת Web App של Google Apps Script (ראו הוראות)
  BIT_LINK: "https://www.bitpay.co.il/app/me/93B017A1-7FD6-E8D1-8DB6-4E0BC51B1762BC50", // אפשר להחליף בלינק התשלום האישי שלכם
  PAYBOX_LINK: "https://payboxapp.page.link/", // אפשר להחליף בלינק האישי שלכם
};
/* תפריט גיבוי – משמש רק אם הטבלה לא מוגדרת או לא זמינה */
let MENU = [
  {cat:"",items:[
    {id:"r1",n:"סלט פפאיה סום טאם",d:"",p:40},
    {id:"r2",n:"סטיקי רייס / אורז לבן",d:"",p:10},
    {id:"r3",n:"פאד תאי טופו",d:"",p:50},
    {id:"r4",n:"פאד תאי עוף",d:"",p:55},
    {id:"r5",n:"קארי ירוק וטופו",d:"תבשיל חלב קוקוס",p:50},
    {id:"r6",n:"קארי ירוק ועוף",d:"תבשיל חלב קוקוס",p:55},
    {id:"r7",n:"קארי צהוב וטופו",d:"תבשיל חלב קוקוס",p:50}]}
];
let ALL = MENU.flatMap(c=>c.items);
const cart = {}; // id -> {q, note}
let orderNo = "";
const $ = s=>document.querySelector(s);
const money = n=>"₪"+n;
const total = ()=>Object.entries(cart).reduce((s,[id,c])=>s+c.q*ALL.find(x=>x.id===id).p,0);
const count = ()=>Object.values(cart).reduce((s,c)=>s+c.q,0);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function showModal(h){$("#modalCard").innerHTML=h;$("#modal").classList.add("on")}
function hideModal(){$("#modal").classList.remove("on")}
function loading(t){showModal(`<div class="spin"></div><p>${t}</p>`)}
function done(title,msg){showModal(`<h3>${title}</h3><p>${msg}</p><button class="primary" id="okBtn">סגירה</button>`);$("#okBtn").onclick=hideModal;$("#okBtn").focus()}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
function go(v){document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id==="v-"+v));
  $("#bar").classList.toggle("on",v==="menu"&&count()>0);scrollTo(0,0);
  if(v==="order")renderOrder();}

function renderMenu(){
  $("#menu").innerHTML=MENU.map(c=>`${c.cat?`<h2 class="cat">${c.cat}</h2>`:""}<div class="grid">`+c.items.map(i=>`
    <div class="dish" id="d-${i.id}"><div class="top"><span>${i.n}</span><span class="price">${money(i.p)}</span></div>
    <small>${i.d}</small>
    <div class="qty"><button class="qb" data-m="${i.id}" aria-label="הפחת">−</button><span class="qn" id="q-${i.id}">0</span><button class="qb" data-p="${i.id}" aria-label="הוסף">+</button></div>
    <input class="note" data-note="${i.id}" placeholder="הערה למנה: חריפות, בלי בוטנים..."></div>`).join("")+`</div>`).join("");
}
function change(id,delta){
  const c=cart[id]||{q:0,note:""};c.q=Math.max(0,c.q+delta);
  if(c.q===0)delete cart[id];else cart[id]=c;
  $("#q-"+id).textContent=c.q;$("#d-"+id).classList.toggle("has",c.q>0);
  $("#barTxt").textContent=count()+" מנות · "+money(total());
  $("#bar").classList.toggle("on",count()>0);
}
function renderOrder(){
  const ids=Object.keys(cart);
  $("#orderList").innerHTML=ids.length?ids.map(id=>{const i=ALL.find(x=>x.id===id),c=cart[id];
    return `<div class="row"><span>${c.q} × ${i.n}${c.note?`<br><small>${esc(c.note)}</small>`:""}</span><b>${money(c.q*i.p)}</b></div>`}).join(""):"העגלה ריקה. חזרו לתפריט לבחירת מנות.";
  $("#oTotal").textContent="סה״כ: "+money(total());
}
function lines(){return Object.entries(cart).map(([id,c])=>{const i=ALL.find(x=>x.id===id);return {name:i.n,qty:c.q,price:i.p,note:c.note||""}})}
function makeNo(){const d=new Date();return "J"+String(d.getDate()).padStart(2,"0")+String(d.getMonth()+1).padStart(2,"0")+"-"+Math.floor(1000+Math.random()*9000)}

function checkout(){
  if(!count())return toast("בחרו לפחות מנה אחת");
  const name=$("#name").value.trim(),phone=$("#phone").value.trim();
  if(name.length<2)return toast("נא להזין שם");
  if(!/^0\d{8,9}$/.test(phone.replace(/[-\s]/g,"")))return toast("מספר טלפון לא תקין");
  orderNo=makeNo();const t=total();
  $("#orderNo").textContent="#"+orderNo;
  $("#summary").innerHTML=`<div class="row"><span>שם</span><b>${esc(name)}</b></div><div class="row"><span>טלפון</span><b>${esc(phone)}</b></div>`+
    lines().map(l=>`<div class="row"><span>${l.qty} × ${l.name}${l.note?`<br><small>${esc(l.note)}</small>`:""}</span><b>${money(l.qty*l.price)}</b></div>`).join("")+
    ($("#gnote").value.trim()?`<div class="row"><span>הערה</span><span>${esc($("#gnote").value.trim())}</span></div>`:"");
  $("#cTotal").textContent=money(t);
  $("#payPhoneTxt").textContent=CONFIG.PAY_PHONE;
  $("#bitLink").href=CONFIG.BIT_LINK;$("#pbxLink").href=CONFIG.PAYBOX_LINK;
  $("#status").textContent="";
  go("checkout");
  send("חדשה"); // רושם את ההזמנה בטבלה מיד עם סיום ההזמנה
}
async function send(status){
  if(!CONFIG.SHEETS_URL){$("#status").textContent="הערה למפעיל: כתובת Google Sheets עדיין לא הוגדרה.";return false}
  const body={orderNo,status,name:$("#name").value.trim(),phone:$("#phone").value.trim(),
    note:$("#gnote").value.trim(),total:total(),items:lines().map(l=>`${l.qty}× ${l.name}${l.note?` (${l.note})`:""}`).join("\n")};
  try{ // text/plain מונע בקשת preflight מול Apps Script
    await fetch(CONFIG.SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
    return true;
  }catch(e){$("#status").textContent="שגיאת רשת. נסו שוב.";return false}
}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast("הועתק")}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.p)change(t.dataset.p,1);
  else if(t.dataset.m)change(t.dataset.m,-1);
  else if(t.dataset.go)go(t.dataset.go);
});
document.addEventListener("input",e=>{const id=e.target.dataset.note;if(id&&cart[id])cart[id].note=e.target.value});
$("#toCheckout").onclick=checkout;
$("#cpPhone").onclick=()=>copy(CONFIG.PAY_PHONE.replace(/\D/g,""));
$("#cpAmount").onclick=()=>copy(String(total()));
$("#paid").onclick=async()=>{
  loading("שולח את הדיווח...");
  const ok=await send("דווח תשלום");
  if(ok){$("#status").textContent="";done("התשלום דווח","תודה! הזמנה "+orderNo+" התקבלה. נתחיל להכין אחרי אימות התשלום.")}
  else done("השליחה נכשלה","לא הצלחנו לשלוח את הדיווח. בדקו את החיבור ונסו שוב.");
};
$("#newOrder").onclick=()=>{for(const k in cart)delete cart[k];renderMenu();$("#gnote").value="";go("menu")};
async function loadMenu(){
  if(!CONFIG.SHEETS_URL)return;
  try{
    const r=await fetch(CONFIG.SHEETS_URL+"?action=menu");
    const rows=await r.json(); // [{cat,name,desc,price,active}]
    const map=new Map();
    rows.forEach((x,i)=>{
      if(!x.name||String(x.active).trim()==="לא")return;
      const c=x.cat||"";if(!map.has(c))map.set(c,[]);
      map.get(c).push({id:"r"+(i+1),n:x.name,d:x.desc||"",p:Number(x.price)||0});
    });
    if(!map.size)return;
    MENU=[...map].map(([cat,items])=>({cat,items}));
    ALL=MENU.flatMap(c=>c.items);
    renderMenu();
  }catch(e){/* נשארים עם תפריט הגיבוי */}
}
renderMenu();loadMenu();
</script>
</body>
</html>
